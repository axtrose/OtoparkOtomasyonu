
workflows:
  park360-ios:
    name: Park360 iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: com.park360.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      xcode: latest

    scripts:
      - name: Check project folder
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          echo "Proje klasoru:"
          pwd
          echo "Xcode proje dosyalari:"
          find ios -maxdepth 5 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print
          ls -la ios/App

      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          npm install

      - name: Sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          npx cap sync ios

      - name: Build unsigned iOS app
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          APP_PATH="$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "HATA: App.app bulunamadi."
            find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 4 -name "*.app" -print
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/App.app"

          cd "$CM_BUILD_DIR/ipa"
          zip -r "$CM_BUILD_DIR/Park360.ipa" Payload

          echo "Olusturulan IPA:"
          ls -lh "$CM_BUILD_DIR/Park360.ipa"

    artifacts:
      - "Park360.ipa"
      - "/Users/builder/clone/Park360.ipa"
