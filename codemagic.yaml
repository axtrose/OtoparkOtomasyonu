
workflows:
  park360-ios:
    name: Park360 iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: com.park360.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest

    scripts:
      - name: Check project folder
        script: |
          cd Otoparkotomasyonu
          pwd
          ls -la
          ls -la ios/App

      - name: Install dependencies
        script: |
          cd Otoparkotomasyonu
          npm install

      - name: Sync Capacitor iOS
        script: |
          cd Otoparkotomasyonu
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd Otoparkotomasyonu
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/Park360.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - "Park360.xcarchive/**"
