
workflows:
  park360-ios:
    name: Park360 iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BUNDLE_ID: com.park360.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      xcode: latest

    scripts:
      - name: Check project folder
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          echo "Proje klasörü:"
          pwd
          echo "Xcode proje dosyaları:"
          find ios -maxdepth 5 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print
          echo "App klasörü:"
          ls -la ios/App

      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          npm install

      - name: Sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd "$CM_BUILD_DIR/Otoparkotomasyonu"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/Park360.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - "/Users/builder/clone/Park360.xcarchive/**"
